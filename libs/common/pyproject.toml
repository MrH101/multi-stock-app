[project]
name = "multistock-common"
version = "0.1.0"
description = "Shared building blocks for Multi-Stock microservices (auth, db, events, app factory)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "pyjwt>=2.9,<3",
  "redis>=5.2,<7",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multistock_common"]
