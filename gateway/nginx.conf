# API gateway: one public origin, routes /api/<service>/ to each microservice.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream identity      { server identity:8000; }
upstream catalog       { server catalog:8000; }
upstream orders        { server orders:8000; }
upstream notifications { server notifications:8000; }
upstream frontend      { server frontend:80; }

server {
    listen 80;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # internal service-to-service endpoints are never exposed publicly
    location ~ ^/api/[a-z]+/internal/ { return 404; }

    location /api/identity/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://identity/auth/;
    }
    location /api/identity/      { proxy_pass http://identity/; }
    location /api/catalog/       { proxy_pass http://catalog/; }
    location /api/orders/        { proxy_pass http://orders/; }
    location /api/notifications/ws {
        proxy_pass http://notifications/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
    location /api/notifications/ { proxy_pass http://notifications/; }

    location / { proxy_pass http://frontend; }
}
