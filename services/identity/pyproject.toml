[project]
name = "identity-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "multistock-common",
  "uvicorn[standard]>=0.32",
  "bcrypt>=4.2",
  "email-validator>=2.2",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
multistock-common = { path = "../../libs/common", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
